# À copier sur le VPS dans /home/deploy/finpret/ avec le Caddyfile et un .env.production (jamais dans Git).
services:
  app:
    image: ghcr.io/bahstiien/finpret:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    # Pas de ports publiés : seul Caddy est exposé, Docker contourne le pare-feu UFW.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
