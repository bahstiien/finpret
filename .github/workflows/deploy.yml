name: Deploy

# Déploiement volontaire : on pousse un tag de version (git tag v1.0.0 && git push origin v1.0.0)
# ou on lance le workflow à la main depuis l'onglet Actions. Jamais à chaque commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/finpret

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm lint --max-warnings 0
      - run: pnpm typecheck
      - run: pnpm test

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Étiquette de l'image
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          # Valeurs publiques (visibles dans le navigateur) : variables du dépôt, pas des secrets.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Environnement « production » : on peut lui imposer une validation manuelle (Settings > Environments).
    environment: production
    steps:
      - name: Clé SSH et empreinte du serveur
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Déployer et vérifier
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER_NAME@$HOST" bash -s -- "$TAG" <<'REMOTE'
          set -euo pipefail
          NEW="$1"
          cd ~/finpret

          # Étiquette en cours, gardée pour pouvoir revenir en arrière.
          OLD="$(grep -s '^APP_TAG=' .env | cut -d= -f2 || true)"

          echo "APP_TAG=$NEW" > .env
          docker compose pull app
          docker compose up -d --remove-orphans

          # Attend que le conteneur soit « healthy » (90 s au plus).
          for i in $(seq 1 18); do
            STATUS="$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || echo starting)"
            echo "état de l'app : $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              docker image prune -f >/dev/null
              echo "Déploiement de $NEW réussi."
              exit 0
            fi
            sleep 5
          done

          echo "L'app ne répond pas : retour à ${OLD:-aucune version précédente}."
          docker compose logs --tail 50 app || true
          if [ -n "$OLD" ]; then
            echo "APP_TAG=$OLD" > .env
            docker compose up -d
          fi
          exit 1
          REMOTE
