name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Base jetable pour les parcours de bout en bout : même version que la production (deploy/docker-compose.yml).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finpret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finpret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finpret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm lint --max-warnings 0
      - run: pnpm typecheck
      - run: pnpm test
      # Tests RLS pgTAP sur PGlite (Postgres en WebAssembly) : ni Docker ni projet distant.
      - run: pnpm test:db:lite

      # Parcours de bout en bout sur la base jetable : migrations, catalogue réel, puis build de production.
      - run: pnpm db:migrate
      - run: pnpm seed
      - name: Variables de l'environnement de test
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
          } > .env.local
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
